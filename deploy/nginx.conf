# 活动配套管理系统 Nginx 站点配置
# 用法：复制到 /etc/nginx/conf.d/huodong.conf，按 TODO 注释修改后 nginx -t && systemctl reload nginx
# 2000 人投票前还需检查主 nginx.conf：worker_processes auto; events.worker_connections >= 10240；
# worker_connections 会同时计算客户端与上游连接，默认 1024/2048 会在高峰主动重置连接。

upstream dth_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 后台登录接口限流防爆破（每 IP 每分钟 10 次）
limit_req_zone $binary_remote_addr zone=dth_login:10m rate=10r/m;

server {
    listen 80;
    server_name vote.example.com;          # TODO: 改为实际域名（朋友域名子域或单位子域 CNAME）

    # 视频分片上传单片 8MB，留足余量；整文件大小由应用层控制
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- Next 构建静态文件：文件名带内容哈希，Nginx 直发并长期缓存 ----
    location /_next/static/ {
        alias /www/huodongpeitai/.next/static/;   # TODO: 改为实际项目目录，末尾带 /
        add_header Cache-Control "public, max-age=31536000, immutable";
        autoindex off;
        expires 365d;
    }

    # ---- 媒体文件直发：不过 Node，原生 Range，现场大流量也扛得住 ----
    location /api/media/ {
        alias /www/huodongpeitai/media/;   # TODO: 改为实际 MEDIA_ROOT 绝对路径，末尾带 /
        location ~* ^/api/media/(tmp|backups)/ { deny all; }
        # 本地无此文件时回退 Node（OSS 模式下 Node 会 302 到 OSS 真实地址）
        error_page 404 = @media_fallback;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
        expires 7d;
    }

    # 媒体回退：本地缺失 → Node（OSS 重定向）
    location @media_fallback {
        proxy_pass http://dth_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- 大屏 SSE：关闭缓冲、拉长超时 ----
    location /api/screen/ {
        proxy_pass http://dth_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 登录接口限流
    location = /api/auth/login {
        limit_req zone=dth_login burst=5 nodelay;
        proxy_pass http://dth_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 其余全部反代 Node ----
    location / {
        proxy_pass http://dth_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

